[tox]
envlist = pre-commit,py310,py311,py312,py313
isolated_build = true

# Pre-commit must pass before any other env runs — same recipe as
# radical.asyncflow's tox.ini: this runs the identical `pre-commit run
# --all-files` CI's pre-commit job runs, so failures show up locally
# (whole repo, not just files you touched) instead of only in CI.
[testenv:pre-commit]
extras = dev
allowlist_externals = pre-commit
commands = pre-commit run --all-files

# Unit test env
[testenv]
depends = pre-commit
extras = dev
commands = pytest tests/unit {posargs}

# Integration test
[testenv:{py310,py311,py312,py313}-all]
depends = pre-commit
extras = dev
setenv =
    RADICAL_VERBOSE=DEBUG
commands = pytest tests/integration {posargs}

# Linting
[testenv:lint]
extras = lint
commands =
    ruff check rose tests
    ruff format --check rose tests

# Formatting
[testenv:format]
extras = lint
commands =
    ruff format rose tests
    ruff check --fix rose tests

# Coverage
[testenv:coverage]
depends = pre-commit
extras = dev
commands = pytest --cov=rose --cov-report=html --cov-report=term {posargs}
